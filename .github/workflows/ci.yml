name: CI

on:
  pull_request:
  # Every branch, not just main. A change that cannot be verified locally (this
  # network blocks binaries.prisma.sh, so the Prisma CLI does not run) has to be
  # provable green before it is merged, and waiting for the push to main to find
  # out is the wrong order.
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Prisma generates its client into node_modules and the typecheck imports
      # those types, so this has to run before tsc. generate reads the schema
      # only, but the datasource block requires the variable to be present.
      - run: npx prisma generate
        env:
          # generate only reads the schema, but the datasource block requires a
          # URL whose scheme matches the provider. Nothing connects here.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      - run: npm run typecheck

      - run: npm test
